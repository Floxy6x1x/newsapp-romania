name: Fetch Teleorman news

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-news.yml'
      - 'scripts/fetch-news.mjs'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch news
        run: node scripts/fetch-news.mjs
      - name: Commit news.json
        run: |
          git config user.name "teleorman-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "Fără modificări"
          else
            git commit -m "Actualizare automată știri Teleorman"
            git push
          fi
